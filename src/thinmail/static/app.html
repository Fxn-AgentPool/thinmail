<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}}</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/theme.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app" data-title="{{title}}">
  <header class="bar">
    <span class="brand">{{title}}<span>.</span></span>
    <nav class="folders" id="folders"></nav>
    <span class="spacer"></span>
    <span class="status" id="status">loading…</span>
    <span class="user">{{user}}</span>
    <button class="btn icon" id="refresh" title="Refresh (r)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <form method="post" action="/logout">
      <button class="btn icon" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg>
      </button>
    </form>
  </header>

  <main>
    <section class="list-pane">
      <div class="card hero hidden" id="hero">
        <div class="what">
          <div class="label">latest code · <span id="hero-age"></span></div>
          <div class="from" id="hero-from"></div>
        </div>
        <button class="code-big" id="hero-code" title="Copy (c)"></button>
        <a class="btn" id="hero-link" target="_blank" rel="noopener noreferrer">Open link</a>
      </div>
      <nav class="aliases hidden" id="aliases" aria-label="Aliases"></nav>
      <div class="list" id="list"><div class="empty">loading…</div></div>
    </section>

    <section class="card reader" id="reader">
      <div class="placeholder" id="placeholder">
        <div>
          select a mail
          <div class="keys"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>↵</kbd> open · <kbd>c</kbd> copy code · <kbd>r</kbd> refresh · <kbd>[</kbd> <kbd>]</kbd> alias · <kbd>esc</kbd> close</div>
        </div>
      </div>
      <div class="head hidden" id="head">
        <h2 class="subject" id="r-subject"></h2>
        <div class="meta"><span id="r-from"></span><span class="addr" id="r-addr"></span><span class="faint mono" id="r-date"></span></div>
        <div class="actions">
          <button class="btn back" id="back">Back</button>
          <span id="r-chips"></span>
          <span class="spacer"></span>
          <button class="btn hidden" id="r-view" title="Text / HTML">HTML</button>
          <button class="btn hidden" id="r-images" title="Load remote images (lets the sender know you read it)">Images</button>
          <button class="btn icon" id="r-delete" title="Delete (#)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </div>
      <div class="body hidden" id="r-body"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
</body>
</html>
