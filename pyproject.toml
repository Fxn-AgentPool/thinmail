[project]
name = "thinmail"
version = "0.1.0"
description = "Thin web inbox for a Stalwart mailbox: login page, recent mail, 2FA codes one click away"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
thinmail = "thinmail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
thinmail = ["static/*"]
